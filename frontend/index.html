<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth website</title>
    <script src="https://unpkg.com/axios@1.20.0/dist/axios.min.js"></script>
  </head>
  <body>
    <div>
      Signup
      <input id="signup-username" type="text" placeholder="Username" />
      <input id="signup-password" type="password" placeholder="Password" />
      <button onclick="signup()">Submit</button>
    </div>

    <div>
      Signin
      <input id="signin-username" type="text" placeholder="Username" />
      <input id="signin-password" type="password" placeholder="Password" />
      <button onclick="signin()">Submit</button>
    </div>

    <div>
      User Info:
      <div id="info"></div>
    </div>

    <div>
      <button onclick="logout()">Logout</button>
    </div>

    <script>
      async function signup() {
        const username = document.getElementById("signup-username").value;
        const password = document.getElementById("signup-password").value;

        try {
          const response = await axios.post("http://localhost:3000/signup", {
            username,
            password,
          });
          alert(response.data.message);
        } catch (err) {
          alert(err.response?.data?.message || "Signup failed");
        }
      }

      async function signin() {
        const username = document.getElementById("signin-username").value;
        const password = document.getElementById("signin-password").value;

        try {
          const response = await axios.post("http://localhost:3000/signin", {
            username,
            password,
          });
          localStorage.setItem("token", response.data.token);
          alert("Signed in successfully!");
          getUserInformation();
        } catch (err) {
          alert(err.response?.data?.message || "Signin failed");
        }
        async function getUserInformation() {
        const token = localStorage.getItem("token");
        if (!token) return;

        try {
          const response = await axios.get("http://localhost:3000/me", {
            headers: { token },
          });
          document.getElementById("info").innerText =
            `Username: ${response.data.username}, Password: ${response.data.password}`;
        } catch (err) {
          document.getElementById("info").innerText = "Not logged in";
        }
      }

      function logout() {
        localStorage.removeItem("token");
        document.getElementById("info").innerText = "";
        alert("Logged out!");
      }

      getUserInformation();
      }
    </script>
  </body>
</html>
